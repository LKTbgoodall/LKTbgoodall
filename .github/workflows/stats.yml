name: Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer les cartes
        run: python3 .github/scripts/stats.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publié sur une branche à part pour que le bot n'apparaisse pas dans les contributeurs
      - name: Publier sur la branche stats
        run: |
          cd stats
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Stats"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stats
