<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="260" viewBox="0 0 440 260">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A5F3FC"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2DD4BF" fill-opacity=".14"/></pattern>
</defs>
<style>
  .in { animation: in .6s cubic-bezier(.2,.9,.3,1.2) backwards; transform-box: fill-box; transform-origin: center; }
  @keyframes in { from { opacity: 0; transform: translateY(14px) scale(.85); } }
  .solve { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: solve 2.4s ease-in-out .6s forwards; } @keyframes solve { to { stroke-dashoffset: 0; } }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 1s ease-out backwards; } @keyframes ring { from { transform: scale(.6); opacity: 0; } }
</style>
<rect width="440" height="260" rx="18" fill="#0d1117"/>
<rect width="440" height="260" rx="18" fill="url(#dots)"/>
<defs>
  <clipPath id="cover"><path d="M18 0H422a18 18 0 0 1 18 18V150H0V18A18 18 0 0 1 18 0z"/></clipPath>
  <radialGradient id="spot" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#F59E0B" stop-opacity=".55"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#F59E0B" stop-opacity=".7"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#cover)">
  <rect width="440" height="150" fill="#0a0f1a"/>
  <rect width="440" height="150" fill="url(#spot)"/>
  <rect width="440" height="150" fill="url(#dots)"/>
  <g fill="none" stroke="#F59E0B">
    <circle class="ring" cx="220.0" cy="75.0" r="52" stroke-opacity=".35"/>
    <circle class="ring" cx="220.0" cy="75.0" r="82" stroke-opacity=".2" style="animation-delay:.6s"/>
    <circle class="ring" cx="220.0" cy="75.0" r="116" stroke-opacity=".1" style="animation-delay:1.2s"/>
  </g>
  <g class="in">
    <circle cx="220.0" cy="75.0" r="60" fill="url(#halo)"/>
    <svg x="184.0" y="39.0" width="72" height="72" viewBox="0 0 24 24" fill="#fff" color="#E2E8F0"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 0H24V20M24 24H0V0"/><path d="M4 0V8M8 0V8M0 12H12M12 4V20M12 6H16M16 6V12M20 4V18M16 18H24M4 16H10M8 16V24M0 20H4"/></g><path class="solve" d="M2 0V10H10V2H18V14H14V22H24" pathLength="1" fill="none" stroke="#FCD34D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </g>
</g>
<rect y="150" width="440" height="1.5" fill="url(#g)" opacity=".6"/>
<g class="in" style="animation-delay:0.20s">
  <text x="26" y="192" style="font: 700 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #E2E8F0">Résolveur de labyrinthes</text>
  <text x="26" y="218" style="font: 400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8B93B5">Résout des labyrinthes en C (main gauche)</text>
  <circle cx="32" cy="241" r="6" fill="#a8b1c2"/>
  <text x="45" y="246" style="font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #E2E8F0">C</text>
  <svg class="arrow" x="394" y="174" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
</g>
<rect x="1" y="1" width="438" height="258" rx="17" fill="none" stroke="url(#g)" stroke-opacity=".5" stroke-width="2"/>
</svg>
