<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="260" viewBox="0 0 440 260">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A5F3FC"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2DD4BF" fill-opacity=".14"/></pattern>
</defs>
<style>
  .in { animation: in .6s cubic-bezier(.2,.9,.3,1.2) backwards; transform-box: fill-box; transform-origin: center; }
  @keyframes in { from { opacity: 0; transform: translateY(14px) scale(.85); } }
  .arrow { animation: nudge 2.4s ease-in-out infinite; } @keyframes nudge { 50% { transform: translate(3px, -3px); } }
  .float { animation: float 4s ease-in-out infinite; } @keyframes float { 50% { transform: translateY(-6px); } }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 3.6s ease-in-out infinite; } @keyframes ring { 50% { transform: scale(1.06); opacity: .5; } }
</style>
<rect width="440" height="260" rx="18" fill="#0d1117"/>
<rect width="440" height="260" rx="18" fill="url(#dots)"/>
<defs>
  <clipPath id="cover"><path d="M18 0H422a18 18 0 0 1 18 18V150H0V18A18 18 0 0 1 18 0z"/></clipPath>
  <radialGradient id="spot" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".55"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<g clip-path="url(#cover)">
  <rect width="440" height="150" fill="#0a0f1a"/>
  <rect width="440" height="150" fill="url(#spot)"/>
  <rect width="440" height="150" fill="url(#dots)"/>
  <g fill="none" stroke="#2DD4BF">
    <circle class="ring" cx="220.0" cy="75.0" r="52" stroke-opacity=".35"/>
    <circle class="ring" cx="220.0" cy="75.0" r="82" stroke-opacity=".2" style="animation-delay:.6s"/>
    <circle class="ring" cx="220.0" cy="75.0" r="116" stroke-opacity=".1" style="animation-delay:1.2s"/>
  </g>
  <g class="float">
    <svg x="184.0" y="39.0" width="72" height="72" viewBox="0 0 24 24" fill="#2DD4BF" filter="url(#blur)" opacity=".8"><rect x="1.5" y="3" width="21" height="18" rx="3" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M1.5 7.5h21" stroke="#fff" stroke-width="1.6"/><circle cx="4.5" cy="5.25" r=".8" fill="#fff"/><circle cx="7" cy="5.25" r=".8" fill="#fff"/><circle cx="9.5" cy="5.25" r=".8" fill="#fff"/><rect x="4.5" y="10.5" width="7" height="7.5" rx="1" fill="#fff" fill-opacity=".9"/><path d="M14 11.5h5.5M14 14.25h5.5M14 17h3.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
    <svg x="184.0" y="39.0" width="72" height="72" viewBox="0 0 24 24" fill="#fff"><rect x="1.5" y="3" width="21" height="18" rx="3" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M1.5 7.5h21" stroke="#fff" stroke-width="1.6"/><circle cx="4.5" cy="5.25" r=".8" fill="#fff"/><circle cx="7" cy="5.25" r=".8" fill="#fff"/><circle cx="9.5" cy="5.25" r=".8" fill="#fff"/><rect x="4.5" y="10.5" width="7" height="7.5" rx="1" fill="#fff" fill-opacity=".9"/><path d="M14 11.5h5.5M14 14.25h5.5M14 17h3.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
  </g>
</g>
<rect y="150" width="440" height="1.5" fill="url(#g)" opacity=".6"/>
<g class="in" style="animation-delay:0.30s">
  <text x="26" y="192" style="font: 700 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #E2E8F0">Portfolio</text>
  <text x="26" y="218" style="font: 400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8B93B5">Mon portfolio</text>
  <circle cx="32" cy="241" r="6" fill="#e34c26"/>
  <text x="45" y="246" style="font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #E2E8F0">HTML</text>
  <svg class="arrow" x="394" y="174" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
</g>
<rect x="1" y="1" width="438" height="258" rx="17" fill="none" stroke="url(#g)" stroke-opacity=".5" stroke-width="2"/>
</svg>
