  .arrow { animation: nudge 2.4s ease-in-out infinite; } @keyframes nudge { 50% { transform: translate(3px, -3px); } }
</style>
<rect width="440" height="150" rx="18" fill="#0d1117"/>
<rect width="440" height="150" rx="18" fill="url(#dots)"/>
